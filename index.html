<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitPro — Master Git & GitHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-[#0d1117] text-[#c9d1d9] font-mono antialiased">

    <!-- Splash / Loading Screen -->
    <div id="splash" class="fixed inset-0 z-50 flex items-center justify-center bg-[#0d1117] transition-opacity duration-700">
      <div class="text-center">
        <div class="terminal-bar mb-6 inline-block">
          <span class="text-[#00ff41] text-xl">>_</span>
          <span class="text-[#58a6ff] text-xl font-bold ml-2">GitPro</span>
          <span class="text-[#8b949e] text-sm ml-3">initializing...</span>
        </div>
        <div class="w-64 h-1.5 bg-[#21262d] rounded-full overflow-hidden mx-auto">
          <div id="splash-progress" class="h-full bg-[#00ff41] rounded-full transition-all duration-300" style="width:0%"></div>
        </div>
        <p class="text-[#8b949e] text-xs mt-3">Loading course modules...</p>
      </div>
    </div>

    <!-- App Container -->
    <div id="app" class="hidden flex flex-col h-screen">

      <!-- Top Navbar -->
      <header class="bg-[#161b22] border-b border-[#30363d] px-4 py-2 flex items-center justify-between flex-shrink-0">
        <div class="flex items-center gap-3">
          <span class="text-[#00ff41] text-xl font-bold tracking-wider">>_ GitPro</span>
          <span class="text-[#8b949e] text-xs hidden sm:inline">Master Git & GitHub</span>
        </div>
        <div class="flex items-center gap-4 text-xs">
          <span id="progress-text" class="text-[#8b949e]">0% complete</span>
          <div class="w-24 h-1.5 bg-[#21262d] rounded-full overflow-hidden hidden sm:block">
            <div id="progress-bar" class="h-full bg-[#00ff41] rounded-full transition-all duration-500" style="width:0%"></div>
          </div>
          <button id="reset-btn" class="text-[#8b949e] hover:text-[#f85149] transition-colors" title="Reset Progress">
            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
          </button>
        </div>
      </header>

      <!-- Main Layout -->
      <div class="flex flex-1 overflow-hidden">

        <!-- Sidebar -->
        <aside id="sidebar" class="bg-[#161b22] border-r border-[#30363d] w-64 flex-shrink-0 overflow-y-auto hidden md:block">
          <div class="p-3 border-b border-[#30363d]">
            <h2 class="text-xs font-semibold text-[#8b949e] uppercase tracking-wider">Curriculum</h2>
          </div>
          <nav id="module-list" class="p-2 space-y-1"></nav>
        </aside>

        <!-- Mobile Sidebar Overlay -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden" onclick="toggleSidebar()"></div>
        <aside id="mobile-sidebar" class="fixed top-0 left-0 h-full w-64 bg-[#161b22] border-r border-[#30363d] z-40 transform -translate-x-full transition-transform duration-300 md:hidden overflow-y-auto">
          <div class="p-3 border-b border-[#30363d] flex items-center justify-between">
            <h2 class="text-xs font-semibold text-[#8b949e] uppercase tracking-wider">Curriculum</h2>
            <button onclick="toggleSidebar()" class="text-[#8b949e] hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <nav id="mobile-module-list" class="p-2 space-y-1"></nav>
        </aside>

        <!-- Content Area -->
        <main class="flex-1 flex flex-col overflow-hidden">

          <!-- Module Header -->
          <div class="bg-[#161b22] border-b border-[#30363d] px-4 py-2 flex items-center gap-3 flex-shrink-0">
            <button class="md:hidden text-[#8b949e] hover:text-white" onclick="toggleSidebar()">
              <i data-lucide="menu" class="w-5 h-5"></i>
            </button>
            <div class="flex items-center gap-2 text-xs">
              <span id="module-badge" class="px-2 py-0.5 rounded-full bg-[#1f6feb]/20 text-[#58a6ff] text-xs font-medium"></span>
              <span id="module-title" class="text-sm font-semibold text-white"></span>
            </div>
            <div class="ml-auto flex items-center gap-2 text-xs">
              <span id="lesson-counter" class="text-[#8b949e]"></span>
              <button id="prev-lesson" class="px-2 py-1 rounded bg-[#21262d] text-[#8b949e] hover:text-white hover:bg-[#30363d] transition-colors disabled:opacity-30 disabled:cursor-not-allowed" disabled>
                <i data-lucide="chevron-left" class="w-3 h-3"></i>
              </button>
              <button id="next-lesson" class="px-2 py-1 rounded bg-[#21262d] text-[#8b949e] hover:text-white hover:bg-[#30363d] transition-colors">
                <i data-lucide="chevron-right" class="w-3 h-3"></i>
              </button>
            </div>
          </div>

          <!-- Scrollable Lesson Content -->
          <div id="lesson-content" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6"></div>

        </main>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
